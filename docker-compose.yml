services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fris
      POSTGRES_USER: fris
      POSTGRES_PASSWORD: fris
    ports:
      - "5432:5432"
    volumes:
      - fris-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fris -d fris"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: "${APP_NAME:-Faculty Research Intelligence System}"
      API_PREFIX: "${API_PREFIX:-/api/v1}"
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fris:fris@db:5432/fris}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOW_DEV_ROLE_HEADER: ${ALLOW_DEV_ROLE_HEADER:-true}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID:-}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  fris-postgres:
